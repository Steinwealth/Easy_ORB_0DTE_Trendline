# Easy ORB Strategy — config manifest & ownership (Config Cleanup Pass 3 — May 2026)
# Loader order (later overrides earlier): Data → Shared → ORBSO → ORB0DTE → Trendline0DTE → Risk → Alerts
# Classifications on ownership_groups: KEEP_PUBLIC | MERGE_INTO_PROFILE | MOVE_TO_CODE_DEFAULT | DEPRECATE | UNKNOWN_USAGE_NEEDS_CODE_SEARCH
# Prefix / exact matching: exact_keys win first; then longest key_prefix wins (see modules/config_surface_metrics.py).

version: 2
loader_order:
  - Data.env
  - Shared.env
  - ORBSO.env
  - ORB0DTE.env
  - Trendline0DTE.env
  - Risk.env
  - Alerts.env

profile_keys:
  SO_PROFILE: { owner: ORB_SO, default: balanced, allowed: [conservative, balanced, aggressive_open, momentum_open] }
  ORB_0DTE_EXECUTION_PROFILE: { owner: ORB_0DTE, default: balanced_open, allowed: [conservative, balanced_open, aggressive_open, momentum_open] }
  TRENDLINE_ENTRY_PROFILE: { owner: TRENDLINE_0DTE, default: balanced, allowed: [conservative, balanced, aggressive_open, momentum_breakout, retest_friendly] }
  OPTIONS_EXIT_PROFILE: { owner: OPTIONS_EXIT, default: balanced, allowed: [conservative, balanced, aggressive_capture, runner_capture] }

# Keys still allowed to appear in multiple files with identical merged effect (post Pass 3 cleanup).
cross_file_duplicate_policy:
  resolved_no_warning_keys: []

deprecated_aliases:
  - canonical: ORB_0DTE_OVEREXTENSION_SOFT_THRESHOLD
    legacy: 0DTE_EXTENSION_THRESHOLD_PCT
    resolution: canonical_wins_if_both_set

